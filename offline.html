<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión - Snack Mary</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; color: #333; }
        .caja { background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); max-width: 360px; }
        img { width: 96px; height: 96px; }
        button { margin-top: 1rem; background: #e21e24; color: #fff; border: 0; border-radius: 10px; padding: .9rem 1.5rem; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/assets/img/icon-192.png" alt="Snack Mary">
        <h2>Sin conexión</h2>
        <p>La tablet no tiene internet. Revisa el Wi-Fi y vuelve a intentar.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
