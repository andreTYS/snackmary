date.timezone = America/Lima
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
upload_max_filesize = 8M
post_max_size = 8M
session.use_strict_mode = 1
session.cookie_samesite = Lax
allow_url_fopen = Off
allow_url_include = Off
max_execution_time = 30
memory_limit = 128M
