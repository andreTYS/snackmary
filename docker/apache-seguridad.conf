# Snack Mary - configuración de seguridad de Apache

# No mostrar versión de Apache/PHP ni permitir TRACE
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Evita el aviso AH00558 (Traefik es quien recibe el dominio real)
ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Archivos ocultos (.git, .env, .htaccess...) nunca se sirven
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# En la carpeta de fotos nunca se ejecuta PHP; solo se sirven .jpg y .webp
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    <FilesMatch "\.(?!(jpg|webp)$)[^.]+$">
        Require all denied
    </FilesMatch>
</Directory>

# Cabeceras de seguridad
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self), bluetooth=(self)"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # Solo se cargan recursos del propio sitio. 'unsafe-inline' es necesario por los
    # scripts y estilos en línea de las páginas; ningún recurso externo puede cargarse.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Header always unset X-Powered-By
</IfModule>
